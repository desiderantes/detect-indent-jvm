name: Release Build and Publish

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      IS_RELEASE: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'Release version:') }}
      JRELEASER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      JRELEASER_GPG_SECRET_KEY: ${{ secrets.JRELEASER_GPG_SECRET_KEY }}
      JRELEASER_GPG_PUBLIC_KEY: ${{ secrets.JRELEASER_GPG_PUBLIC_KEY }}
      JRELEASER_GPG_PASSPHRASE: ${{ secrets.JRELEASER_GPG_PASSPHRASE }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Run Gradle build (skip tests)
        run: ./gradlew build -x test

      - name: Run Gradle tests
        id: tests
        run: ./gradlew test

      - name: Upload test results
        if: failure() && steps.tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/test-results

      - name: Publish to Staging Repository
        if: env.IS_RELEASE == 'true'
        run: ./gradlew publishAllPublicationsToStagingRepository

      - name: Run JReleaser Full Release
        id: jreleaser
        if: env.IS_RELEASE == 'true'
        run: |
          set -o pipefail
          ./gradlew jreleaserFullRelease --debug -Djreleaser.trace=true 2>&1 | tee jreleaser-console.log

      - name: Prepare log artifact
        if: failure() && steps.jreleaser.outcome == 'failure'
        run: |
          mkdir -p logs
          [ -f jreleaser-console.log ] && cp jreleaser-console.log logs/console.log
          [ -f build/jreleaser/trace.log ] && cp build/jreleaser/trace.log logs/trace.log || true

      - name: Upload JReleaser logs
        if: failure() && steps.jreleaser.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: jreleaser-logs
          path: logs/
